services:

  app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    image: atlasventure-app
    container_name: atlasventure_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: atlasventure_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  frontend:
    build:
      context: ./AtlassVenturs-Frontend
      dockerfile: Dockerfile
    image: atlasventure-frontend
    container_name: atlasventure_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: atlasventure_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: AtlassVenturs
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: atlasventure_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local